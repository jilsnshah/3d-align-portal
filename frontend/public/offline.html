<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Align — no connection</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #0b0b0c;
        color: #faf9f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .box { max-width: 340px; }
      img { width: 148px; height: auto; margin-bottom: 26px; }
      h1 { margin: 0 0 10px; font-size: 1.25rem; letter-spacing: -0.02em; }
      p { margin: 0 0 22px; color: #b6b6bd; line-height: 1.5; font-size: 0.95rem; }
      button {
        font: inherit;
        font-weight: 600;
        padding: 11px 22px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(180deg, #d4af37, #b8912f);
        color: #14141a;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/logo.png" alt="3D Align" />
      <h1>No connection</h1>
      <p>
        Cases, scans and treatment plans live with 3D Align, so the portal needs a
        connection to show you anything current.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
